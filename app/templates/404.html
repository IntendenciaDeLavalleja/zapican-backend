<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Not Found</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    h1 { font-size: 6rem; font-weight: 700; color: #ccc; line-height: 1; }
    h2 { font-size: 1.5rem; font-weight: 600; margin: 0.5rem 0 1rem; }
    p  { color: #666; max-width: 360px; line-height: 1.6; }
    a  { color: #555; text-decoration: underline; }
    footer { margin-top: 3rem; font-size: 0.75rem; color: #aaa; }
  </style>
</head>
<body>
  <h1>404</h1>
  <h2>Página no encontrada</h2>
  <p>La dirección que ingresaste no existe o fue eliminada.<br>
     Verificá la URL o <a href="/">volvé al inicio</a>.</p>
  <footer>Apache/2.4 Server</footer>
</body>
</html>
