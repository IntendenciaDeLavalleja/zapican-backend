{% extends 'admin/base.html' %}
{% block title %}Iniciar Sesión{% endblock %}
{% block auth_content %}
<div class='px-2'>
  <form method='post'>
    <input type='hidden' name='csrf_token' value='{{ csrf_token() }}'>
    <div class='space-y-5'>
      <div>
        <label class='label'>Usuario corporativo o email</label>
        <input class='input' type='text' name='email' required autofocus placeholder='admin@municipio.gov.uy'>
      </div>
      <div>
        <label class='label flex items-center justify-between'>
          <span>Contraseña</span>
        </label>
        <input class='input' type='password' name='password' required placeholder='••••••••'>
      </div>
      <div class='p-4 bg-slate-50 border border-slate-200 rounded-xl mt-6'>
        <label class='label flex items-center justify-between text-slate-600 mb-0'>
          <span class='text-xs uppercase tracking-wider font-bold'>Verificación anti-spam</span>
          <span class='text-xs font-black bg-white px-2 py-1 rounded shadow-sm border border-slate-200 text-blue-600'>¿ {{ captcha_question }} ?</span>
        </label>
        <input class='input bg-white mt-3' type='number' name='captcha' required placeholder='Ingresar el resultado'>
      </div>
      <button class='btn btn-primary w-full justify-center mt-2 group py-3' type='submit'>
        <span>Ingresar al sistema</span>
        <i data-lucide='arrow-right' class='w-4 h-4 opacity-70 group-hover:translate-x-1 group-hover:opacity-100 transition-all'></i>
      </button>
    </div>
  </form>
</div>
{% endblock %}
