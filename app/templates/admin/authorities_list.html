{% extends "admin/base.html" %}
{% block title %}Autoridades{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6 gap-2">
  <h1 class="text-2xl font-semibold">Autoridades</h1>
  <div class="flex gap-2">
    
    <a class="btn btn-primary" href="{{ url_for('admin.authority_new') }}">+ Nueva</a>
  </div>
</div>
<div class="card overflow-x-auto">
  <table class="table">
    <thead><tr><th>Orden</th><th>Nombre</th><th>Cargo</th><th>Email</th><th></th></tr></thead>
    <tbody>
      {% for a in authorities %}
      <tr>
        <td>{{ a.order_index }}</td>
        <td><a class="font-medium hover:underline" href="{{ url_for('admin.authority_edit', auth_id=a.id) }}">{{ a.name }}</a></td>
        <td>{{ a.role }}</td>
        <td class="text-xs text-slate-500">{{ a.email or '—' }}</td>
        <td class="text-right"><div class="flex items-center justify-end gap-2"><a class="btn btn-secondary" href="{{ url_for('admin.authority_edit', auth_id=a.id) }}">Editar</a><form method="post" action="{{ url_for('admin.authority_delete', auth_id=a.id) }}" onsubmit="return confirm('Eliminar?')"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-danger">×</button></form></div></td>
      </tr>
      {% else %}<tr><td colspan="5" class="text-center text-slate-400 py-8">Sin autoridades.</td></tr>{% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
