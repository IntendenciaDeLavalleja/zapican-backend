{% extends "admin/base.html" %}
{% block title %}Formularios{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6 gap-2">
  <h1 class="text-2xl font-semibold">Formularios</h1>
  <div class="flex gap-2">
    
    <a class="btn btn-primary" href="{{ url_for('admin.form_new') }}">+ Nuevo</a>
  </div>
</div>
<div class="card overflow-x-auto">
  <table class="table">
    <thead><tr><th>Título</th><th>Slug</th><th>Activo</th><th></th></tr></thead>
    <tbody>
      {% for f in forms %}
      <tr>
        <td><a class="font-medium hover:underline" href="{{ url_for('admin.form_edit', form_id=f.id) }}">{{ f.title }}</a></td>
        <td><code class="text-xs">{{ f.slug }}</code></td>
        <td>{{ '✓' if f.is_active else '' }}</td>
        <td class="text-right space-x-2">
          <a class="btn btn-secondary" href="{{ url_for('admin.form_edit', form_id=f.id) }}">Editar</a>
          <a class="btn btn-secondary" href="{{ url_for('admin.form_submissions', form_id=f.id) }}">Respuestas</a>
          <form method="post" action="{{ url_for('admin.form_delete', form_id=f.id) }}" onsubmit="return confirm('Eliminar?')" class="inline"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-danger">×</button></form>
        </td>
      </tr>
      {% else %}<tr><td colspan="4" class="text-center text-slate-400 py-8">Sin formularios.</td></tr>{% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
