{% extends "admin/base.html" %}
{% block title %}Verificar 2FA{% endblock %}
{% block auth_content %}
<div class="card">
  <h1 class="text-xl font-semibold mb-2 text-center">Verificación en dos pasos</h1>
  <p class="text-sm text-slate-600 mb-4 text-center">Te enviamos un código de 6 dígitos a tu correo.</p>
  <form method="post" action="{{ url_for('admin.verify_2fa') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="space-y-3">
      <input class="input text-center text-2xl tracking-widest" type="text" name="code" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" required autofocus>
      <button class="btn btn-primary w-full justify-center" type="submit">Verificar</button>
      <a href="{{ url_for('admin.login') }}" class="block text-center text-xs text-slate-500 hover:text-slate-700">Volver al inicio de sesión</a>
    </div>
  </form>
</div>
{% endblock %}
