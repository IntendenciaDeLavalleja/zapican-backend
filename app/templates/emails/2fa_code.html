<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Codigo de verificacion</title></head>
<body style="font-family: system-ui, sans-serif; background:#fafaf7; padding:24px;">
  <div style="max-width:480px;margin:0 auto;background:#fff;padding:32px;border-radius:12px;border:1px solid #eee;">
    <h2 style="margin-top:0;color:#1f3a2c;">Lavalleja CMS</h2>
    <p>Tu codigo de verificacion es:</p>
    <p style="font-size:32px;letter-spacing:4px;font-weight:700;color:#2f6f4e;">{{ code }}</p>
    <p style="color:#666;font-size:14px;">El codigo es valido por 10 minutos. Si no fuiste vos, ignora este mensaje.</p>
  </div>
</body>
</html>
